name: Gerar APK do aplicativo

# Gera o instalador Android do ERP.
# Rode manualmente em: Actions → "Gerar APK do aplicativo" → "Run workflow".
# O arquivo .apk fica disponível para download ao final, em "Artifacts".
on:
  workflow_dispatch:
    inputs:
      versao:
        description: 'Nome da versão (ex.: 1.0.0)'
        required: false
        default: '1.0.0'
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/apk.yml']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ajustar o nome da versão
        if: ${{ github.event.inputs.versao != '' }}
        working-directory: android
        run: |
          sed -i 's/versionName = "[^"]*"/versionName = "${{ github.event.inputs.versao }}"/' app/build.gradle.kts
          grep -n 'versionName' app/build.gradle.kts

      - name: Preparar chave de assinatura
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/loja-da-banana.jks"
            echo "assinado=sim" >> "$GITHUB_OUTPUT"
            echo "Chave própria encontrada: o APK será assinado com ela."
          else
            echo "assinado=nao" >> "$GITHUB_OUTPUT"
            echo "Sem a chave KEYSTORE_BASE64: será gerado um APK de teste (debug)."
          fi

      # Com chave própria: APK de release, que permite atualizar por cima.
      - name: Compilar APK assinado
        if: steps.keystore.outputs.assinado == 'sim'
        working-directory: android
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/loja-da-banana.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      # Sem chave: APK de teste, instalável do mesmo jeito.
      - name: Compilar APK de teste
        if: steps.keystore.outputs.assinado == 'nao'
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Localizar o APK
        id: apk
        run: |
          CAMINHO=$(find android/app/build/outputs/apk -name "*.apk" | head -1)
          echo "Arquivo gerado: $CAMINHO"
          echo "caminho=$CAMINHO" >> "$GITHUB_OUTPUT"
          mkdir -p entrega
          cp "$CAMINHO" "entrega/loja-da-banana-${{ github.event.inputs.versao || '1.0.0' }}.apk"
          ls -la entrega/

      - name: Publicar o instalador
        uses: actions/upload-artifact@v4
        with:
          name: loja-da-banana-apk
          path: entrega/*.apk
          retention-days: 90
          if-no-files-found: error
